# ==============================================================================
# Configurazione NAMD 3 Matched Comparison (400 K, 2.5 ns = 1.250.000 step)
# Generata automaticamente da scripts/08_build_matched_mutants_charmm36m.tcl
# Protocollo identico a 02_wt_baseline/wt_400K.conf (Slide 3, 15, 21)
# ==============================================================================
structure          04_md_simulations/T103L/T103L_wb_ionized.psf
coordinates        04_md_simulations/T103L/T103L_wb_ionized.pdb
set temperature    400
set outputname     04_md_simulations/T103L/T103L_400K_seed3
firsttimestep      0

paraTypeCharmm     on
parameters         common/charmm36/par_all36m_prot.prm
parameters         common/charmm36/toppar_water_ions_namd.prm
temperature        $temperature
seed               34567

# Force-Field Parameters (Matched)
exclude            scaled1-4
1-4scaling         1.0
cutoff             12.0
switching          on
switchdist         10.0
pairlistdist       14.0

# Integrator Parameters (dt = 2.0 fs, SHAKE/RATTLE)
timestep           2.0
rigidBonds         all
nonbondedFreq      1
fullElectFrequency 2
stepspercycle      10

# Constant Temperature Control (Langevin Thermostat)
langevin           on
langevinDamping    1
langevinTemp       $temperature
langevinHydrogen   off

# Periodic Boundary Conditions
cellBasisVector1   72.589   0.000   0.000
cellBasisVector2   0.000   58.517   0.000
cellBasisVector3   0.000   0.000   58.883
cellOrigin         7.599   -8.343   85.476
wrapAll            on

# PME (Full-System Periodic Electrostatics)
PME                yes
PMEGridSpacing     1.0

# Constant Pressure Control (Nose-Hoover Langevin Piston, 1 atm)
useGroupPressure      yes
useFlexibleCell       no
useConstantArea       no
langevinPiston        on
langevinPistonTarget  1.01325
langevinPistonPeriod  100.0
langevinPistonDecay   50.0
langevinPistonTemp    $temperature

# Output Frequencies (1 frame ogni 1000 step = 2 ps -> 1250 frame in 2.5 ns)
outputName         $outputname
restartfreq        5000
dcdfreq            1000
xstFreq            1000
outputEnergies     1000
outputPressure     1000

# Protocollo di Esecuzione Matched: 1000 step Minimizzazione + 1.250.000 step (2.5 ns) NPT
minimize           1000
reinitvels         $temperature
run                1250000
