################################################################################
## benchmark.conf
## Fase 2 (ROAD2.md - Passo 2.1):
## Benchmark di velocita' HPC (ns/day) con NAMD 3 sul sistema 2myo_wb_ionized
## (21.461 atomi, CHARMM36m + TIP3P + 0.15 M NaCl, PME, NPT a 300 K).
##
## Esecuzione dalla cartella principale BML/:
##   namd3 +p16 02_wt_baseline/benchmark.conf > 02_wt_baseline/benchmark.log
################################################################################

structure          ../01_structures/2myo_wb_ionized.psf
coordinates        ../01_structures/2myo_wb_ionized.pdb

set temperature    300
set outputname     benchmark_out

firsttimestep      0
seed               12345

################################################################################
## PARAMETRI DEL FORCE FIELD (CHARMM36m + TIP3P Water & Ions)                 ##
################################################################################

paraTypeCharmm     on
parameters         ../common/charmm36/par_all36m_prot.prm
parameters         ../common/charmm36/toppar_water_ions_namd.prm
temperature        $temperature

# Interazioni Non-Bonded (Cutoff standard CHARMM36m / Lecture04 Slide 19)
exclude            scaled1-4
1-4scaling         1.0
cutoff             12.0
switching          on
switchdist         10.0
pairlistdist       14.0

################################################################################
## PARAMETRI DELL'INTEGRATORE (Verlet / r-RESPA, dt = 2.0 fs)                 ##
################################################################################

timestep           2.0  ;# 2.0 fs/step (500.000 step = 1 ns)
rigidBonds         all  ;# SHAKE/RATTLE sulle molle H-atomo pesante
nonbondedFreq      1
fullElectFrequency 2
stepspercycle      10

################################################################################
## CONDIZIONI PERIODICHE AL CONTORNO (PBC - Da 01_structures/pbc_box_params)  ##
################################################################################

cellBasisVector1    71.840    0.000    0.000
cellBasisVector2     0.000   58.972    0.000
cellBasisVector3     0.000    0.000   54.840
cellOrigin           7.735   -8.087   86.003

wrapAll            on
wrapWater          on

# Elettrostatica a lungo raggio su griglia FFT 3D (Particle Mesh Ewald)
PME                yes
PMEGridSpacing     1.0

################################################################################
## CONTROLLO DI TEMPERATURA E PRESSIONE (Ensemble NPT: 300 K, 1 atm)          ##
################################################################################

# Termostato stocastico di Langevin
langevin           on
langevinDamping    1.0
langevinTemp       $temperature
langevinHydrogen   off

# Barostato di Nose-Hoover Langevin Piston (1 atm = 1.01325 bar)
useGroupPressure     yes
useFlexibleCell      no
useConstantArea      no
langevinPiston       on
langevinPistonTarget 1.01325
langevinPistonPeriod 100.0
langevinPistonDecay  50.0
langevinPistonTemp   $temperature

################################################################################
## OUTPUT                                                                     ##
################################################################################

outputName         $outputname
restartfreq        1000
dcdfreq            1000
xstFreq            1000
outputEnergies     100
outputPressure     100
outputTiming       500

################################################################################
## ESECUZIONE BENCHMARK (500 step minimize + 2500 step = 5 ps MD)             ##
################################################################################

minimize           500
reinitvels         $temperature
run                2500
