################################################################################
## wt_400K.conf
## Fase 2 (ROAD2.md - Passo 2.3):
## Simulazione MD Baseline del Wild-Type (2MYO) a T = 400 K (Stress Termico,
## protocollo Bekker, Ma & Kamiya 2019 per individuare i residui instabili Q_i < 0.6)
##
## Durata impostata:
##   - Minimizzazione: 1000 step
##   - Produzione NPT (400 K, 1 atm): 1.250.000 step = 2.5 ns (~6.4 ore su 16 thread)
################################################################################

structure          ../01_structures/2myo_wb_ionized.psf
coordinates        ../01_structures/2myo_wb_ionized.pdb

set temperature    400
set outputname     wt_400K
set min_steps      1000
set run_steps      1250000  ;# 1.250.000 * 2 fs = 2.5 ns (salva 1 frame ogni 2 ps -> 1250 frame)

firsttimestep      0
seed               10400

################################################################################
## PARAMETRI DEL FORCE FIELD (CHARMM36m + TIP3P Water & Ions)                 ##
################################################################################

paraTypeCharmm     on
parameters         ../common/charmm36/par_all36m_prot.prm
parameters         ../common/charmm36/toppar_water_ions_namd.prm
temperature        $temperature

exclude            scaled1-4
1-4scaling         1.0
cutoff             12.0
switching          on
switchdist         10.0
pairlistdist       14.0

################################################################################
## PARAMETRI DELL'INTEGRATORE (dt = 2.0 fs, SHAKE/RATTLE)                     ##
################################################################################

timestep           2.0
rigidBonds         all
nonbondedFreq      1
fullElectFrequency 2
stepspercycle      10

################################################################################
## CONDIZIONI PERIODICHE AL CONTORNO (PBC) E PME                              ##
################################################################################

cellBasisVector1    71.840    0.000    0.000
cellBasisVector2     0.000   58.972    0.000
cellBasisVector3     0.000    0.000   54.840
cellOrigin           7.735   -8.087   86.003

wrapAll            on
wrapWater          on

PME                yes
PMEGridSpacing     1.0

################################################################################
## TERMOSTATO DI LANGEVIN E BAROSTATO LANGEVIN PISTON (NPT: 400 K, 1 atm)     ##
################################################################################

langevin           on
langevinDamping    1.0
langevinTemp       $temperature
langevinHydrogen   off

useGroupPressure     yes
useFlexibleCell      no
useConstantArea      no
langevinPiston       on
langevinPistonTarget 1.01325
langevinPistonPeriod 100.0
langevinPistonDecay  50.0
langevinPistonTemp   $temperature

################################################################################
## OUTPUT E SALVATAGGIO TRAIETTORIA (.dcd ogni 1000 step = 2 ps)              ##
################################################################################

outputName         $outputname
restartfreq        5000     ;# Salva file di restart ogni 10 ps
dcdfreq            1000     ;# Salva un fotogramma nel .dcd ogni 2 ps
xstFreq            1000
outputEnergies     1000
outputPressure     1000
outputTiming       5000

################################################################################
## ESECUZIONE                                                                 ##
################################################################################

minimize           $min_steps
reinitvels         $temperature
run                $run_steps
