################################################################################
## smoke_test_400K.conf
## Configurazione di VALIDAZIONE RAPIDA (~45 secondi) a 400 K per testare
## end-to-end tutta la pipeline (NAMD -> 03_analyze_wt_baseline.tcl -> plot_wt_baseline.py)
## PRIMA di lanciare il job notturno!
################################################################################

structure          ../01_structures/2myo_wb_ionized.psf
coordinates        ../01_structures/2myo_wb_ionized.pdb

set temperature    400
set outputname     smoke_400K

firsttimestep      0
seed               10400

paraTypeCharmm     on
parameters         ../common/charmm36/par_all36m_prot.prm
parameters         ../common/charmm36/toppar_water_ions_namd.prm
temperature        $temperature

exclude            scaled1-4
1-4scaling         1.0
cutoff             12.0
switching          on
switchdist         10.0
pairlistdist       14.0

timestep           2.0
rigidBonds         all
nonbondedFreq      1
fullElectFrequency 2
stepspercycle      10

cellBasisVector1    71.840    0.000    0.000
cellBasisVector2     0.000   58.972    0.000
cellBasisVector3     0.000    0.000   54.840
cellOrigin           7.735   -8.087   86.003

wrapAll            on
wrapWater          on

PME                yes
PMEGridSpacing     1.0

langevin           on
langevinDamping    1.0
langevinTemp       $temperature
langevinHydrogen   off

useGroupPressure     yes
useFlexibleCell      no
useConstantArea      no
langevinPiston       on
langevinPistonTarget 1.01325
langevinPistonPeriod 100.0
langevinPistonDecay  50.0
langevinPistonTemp   $temperature

outputName         $outputname
restartfreq        500
dcdfreq            250      ;# Salva 8 fotogrammi in 2000 step per testare gli script di analisi
xstFreq            250
outputEnergies     250
outputPressure     250
outputTiming       500

minimize           500
reinitvels         $temperature
run                2000
